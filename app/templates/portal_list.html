{% extends "base_public.html" %}{% block title %}شهاداتي{% endblock %}
{% block content %}<div class="card"><h1>شهاداتك</h1>{% for x in rows %}<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)"><div><b>{{ x.title_ar }}</b><div class="small muted">{{ x.event_date }} · {{ '%g'|format(x.hours) }} ساعة · <span class="mono">{{ x.serial }}</span></div></div>
<a class="btn sm pri" href="{{ url_for('public.portal_pdf', token=token, serial=x.serial) }}">{{ m.ico('dl') }} PDF</a></div>{% else %}<p class="muted">لا توجد شهادات.</p>{% endfor %}</div>{% endblock %}
