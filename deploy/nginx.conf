# بديل Nginx (تشغيل مباشر على السيرفر، INJAZ_BEHIND_PROXY=1 و INJAZ_HOST=127.0.0.1)
# الشهادة عبر certbot:  sudo certbot --nginx -d injaz.example.edu
server {
    listen 80;
    server_name injaz.example.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name injaz.example.edu;
    ssl_certificate     /etc/letsencrypt/live/injaz.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/injaz.example.edu/privkey.pem;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # CORS غير مطلوب (نفس الأصل)
}
